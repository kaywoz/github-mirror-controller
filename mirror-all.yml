name: mirror all repos to Codeberg
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
permissions:
  contents: write
env:
  SKIP_REPOS: github-mirror-controller
  CODEBERG_OWNER: kaywoz
  CODEBERG_API: https://codeberg.org/api/v1
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping healthchecks.io (start)
        if: always()
        run: curl -fsS -m 10 --retry 5 "${{ secrets.HC_PING_URL }}/start" > /dev/null || true

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y git jq gh curl

      - name: Setup SSH for Codeberg
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CODEBERG_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan codeberg.org >> ~/.ssh/known_hosts

      - name: List all GitHub repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo list ${{ github.repository_owner }} \
            --limit 1000 \
            --json name,url,isFork,isArchived \
            --jq '.[] | select(.isFork == false and .isArchived == false) | "\(.name) \(.url)"' \
            > repos.txt

      - name: Mirror repositories to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          while read name repoUrl; do
            if [[ "$SKIP_REPOS" == *"$name"* ]]; then
              echo "Skipping $name"
              continue
            fi
            echo "=== Processing $name ==="
            # Check if repo exists on Codeberg
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token $CODEBERG_TOKEN" \
              "$CODEBERG_API/repos/$CODEBERG_OWNER/$name")
            if [ "$status" = "404" ]; then
              echo "Creating $name on Codeberg"
              curl -s -X POST "$CODEBERG_API/user/repos" \
                -H "Authorization: token $CODEBERG_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{
                  \"name\": \"$name\",
                  \"private\": false
                }"
            else
              echo "$name already exists on Codeberg"
            fi
            rm -rf "$name.git"
            git clone --mirror "$repoUrl" "$name.git"
            cd "$name.git"
            # Mirror branches and tags only — GitHub's clone includes refs/pull/*,
            # which Codeberg (like GitHub) rejects as a protected/hidden ref
            # namespace, so a plain `push --mirror` fails on those refs.
            git push --prune "git@codeberg.org:$CODEBERG_OWNER/$name.git" \
              '+refs/heads/*:refs/heads/*' \
              '+refs/tags/*:refs/tags/*'
            cd ..
          done < repos.txt

      - name: Record heartbeat
        if: always()
        run: |
          mkdir -p .github/mirror-status
          {
            echo "# Mirror run log"
            echo "Last run: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "Outcome: ${{ job.status }}"
            echo "Repos considered: $(wc -l < repos.txt 2>/dev/null || echo unknown)"
          } > .github/mirror-status/last-run.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/mirror-status/last-run.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: record mirror run ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Ping healthchecks.io (success)
        if: success()
        run: curl -fsS -m 10 --retry 5 "${{ secrets.HC_PING_URL }}" > /dev/null || true

      - name: Ping healthchecks.io (failure)
        if: failure()
        run: curl -fsS -m 10 --retry 5 "${{ secrets.HC_PING_URL }}/fail" > /dev/null || true
